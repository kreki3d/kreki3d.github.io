<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Árkalkulátor PWA</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ÁrKalk">

    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Dynamic Manifest & Service Worker Setup -->
    <script>
        // 1. Inject Manifest
        const manifest = {
            "name": "Árkalkulátor",
            "short_name": "ÁrKalk",
            "start_url": "http://localhost:8000/",
            "display": "standalone",
            "background_color": "#f1f5f9",
            "theme_color": "#0f172a",
            "orientation": "portrait",
            "icons": [
                {
                    "src": "https://cdn-icons-png.flaticon.com/512/265/265686.png",
                    "sizes": "512x512",
                    "type": "image/png"
                }
            ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        const manifestUrl = URL.createObjectURL(manifestBlob);
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestUrl;
        document.head.appendChild(link);

        // 2. Register Service Worker (Basic Offline Support)
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', (e) => self.skipWaiting());
                self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
                self.addEventListener('fetch', (e) => {
                    e.respondWith(fetch(e.request).catch(() => new Response('Offline Mode')));
                });
            `;
            const swBlob = new Blob([swCode], {type: 'application/javascript'});
            const swUrl = URL.createObjectURL(swBlob);
            navigator.serviceWorker.register(swUrl)
                .then(() => console.log('SW Registered'))
                .catch(err => console.error('SW Error:', err));
        }
    </script>

    <style>
        /* Custom tweaks for PWA feel */
        body { -webkit-tap-highlight-color: transparent; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Inline Icons to avoid external dependencies ---
        const Icon = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></Icon>;
        const Trash2 = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></Icon>;
        const Calculator = (p) => <Icon {...p}><rect x="4" y="2" width="16" height="20" rx="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="16" y1="14" x2="16" y2="14"></line><line x1="12" y1="14" x2="12" y2="14"></line><line x1="8" y1="14" x2="8" y2="14"></line><line x1="16" y1="18" x2="16" y2="18"></line><line x1="12" y1="18" x2="12" y2="18"></line><line x1="8" y1="18" x2="8" y2="18"></line></Icon>;
        const DollarSign = (p) => <Icon {...p}><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></Icon>;
        const Clock = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></Icon>;
        const Scale = (p) => <Icon {...p}><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1z"></path><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1z"></path><path d="M7 21h10"></path><path d="M12 3v18"></path><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"></path></Icon>;

        // --- Main Component ---
        const PricingCalculator = () => {
            const [rows, setRows] = useState([{ id: 0, resource: '', time: '' }]);
            const [results, setResults] = useState(null);
            const [focusNewRow, setFocusNewRow] = useState(false);

            const ROUNDING_STEP = 50;

            useEffect(() => {
                if (focusNewRow) {
                    const lastIndex = rows.length - 1;
                    const element = document.getElementById(`res-${lastIndex}`);
                    if (element) element.focus();
                    setFocusNewRow(false);
                }
            }, [rows.length, focusNewRow]);

            useEffect(() => {
                const firstInput = document.getElementById('res-0');
                if (firstInput) firstInput.focus();
            }, []);

            const roundUp = (num) => {
                if (num === 0) return 0;
                return Math.ceil(num / ROUNDING_STEP) * ROUNDING_STEP;
            };

            const formatCurrency = (num) => {
                return new Intl.NumberFormat('hu-HU', {
                    style: 'currency',
                    currency: 'HUF',
                    maximumFractionDigits: 0
                }).format(num);
            };

            const handleInputChange = (index, field, value) => {
                const newRows = [...rows];
                newRows[index][field] = value;
                setRows(newRows);
            };

            const addRow = () => {
                const newId = rows.length > 0 ? Math.max(...rows.map(r => r.id)) + 1 : 0;
                setRows([...rows, { id: newId, resource: '', time: '' }]);
                setFocusNewRow(true);
            };

            const removeRow = (index) => {
                if (rows.length === 1) {
                    setRows([{ id: 0, resource: '', time: '' }]);
                    return;
                }
                const newRows = rows.filter((_, i) => i !== index);
                setRows(newRows);
            };

            const calculate = () => {
                let totalResource = 0;
                let totalTime = 0;

                rows.forEach(row => {
                    totalResource += parseFloat(row.resource) || 0;
                    totalTime += parseFloat(row.time) || 0;
                });

                const basePrice = (totalResource * 10) + (totalTime * 100);
                const discountedResell = roundUp(basePrice * 3);
                const range1 = roundUp(discountedResell * 1.2);
                const range2 = roundUp(discountedResell * 1.4);
                const range3 = roundUp(discountedResell * 1.6);

                setResults({
                    totals: { resource: totalResource, time: totalTime },
                    basePrice,
                    discountedResell,
                    range1, range2, range3
                });
            };

            const handleKeyDown = (e, index, field) => {
                if (field === 'resource' && e.key === 'Enter') {
                    e.preventDefault();
                    const timeInput = document.getElementById(`time-${index}`);
                    if (timeInput) timeInput.focus();
                }
                if (field === 'time') {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        calculate();
                    }
                    if (e.key.toLowerCase() === 'p') {
                        e.preventDefault();
                        addRow();
                    }
                }
            };

            return (
                <div className="min-h-screen bg-slate-100 text-slate-800 p-4 md:p-8 font-sans pb-20 md:pb-8">
                    <div className="max-w-3xl mx-auto space-y-6">
                        
                        {/* Header */}
                        <div className="text-center space-y-2 mb-8 mt-4 md:mt-0">
                            <h1 className="text-3xl font-bold text-slate-900 tracking-tight">Árkalkulátor</h1>
                            <p className="text-slate-500 text-sm hidden md:block">
                                <kbd className="bg-slate-200 px-1 rounded">Enter</kbd>: navigálás/számítás, <kbd className="bg-slate-200 px-1 rounded">P</kbd>: új sor.
                            </p>
                            <p className="text-slate-500 text-sm md:hidden">
                                Töltsd ki a mezőket a számításhoz.
                            </p>
                        </div>

                        {/* Input Card */}
                        <div className="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
                            <div className="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                                <h2 className="font-semibold text-slate-700 flex items-center gap-2">
                                    <Scale size={18} /> Adatok
                                </h2>
                                <button 
                                    onClick={() => setRows([{ id: 0, resource: '', time: '' }])}
                                    className="text-xs text-red-500 hover:text-red-700 font-medium"
                                >
                                    Visszaállítás
                                </button>
                            </div>

                            <div className="p-6 space-y-4">
                                {rows.map((row, index) => (
                                    <div key={row.id} className="flex flex-col sm:flex-row gap-3 items-end sm:items-center animate-in fade-in slide-in-from-top-2 duration-300">
                                        <div className="flex-1 w-full relative">
                                            <label className="text-xs font-semibold text-slate-400 absolute -top-2.5 left-2 bg-white px-1">
                                                Filament (g)
                                            </label>
                                            <input
                                                id={`res-${index}`}
                                                type="number"
                                                inputMode="decimal"
                                                placeholder="0"
                                                value={row.resource}
                                                onChange={(e) => handleInputChange(index, 'resource', e.target.value)}
                                                onKeyDown={(e) => handleKeyDown(e, index, 'resource')}
                                                className="w-full pl-3 pr-3 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all bg-slate-50 focus:bg-white"
                                            />
                                        </div>

                                        <div className="flex-1 w-full relative">
                                            <label className="text-xs font-semibold text-slate-400 absolute -top-2.5 left-2 bg-white px-1">
                                                Idő (óra)
                                            </label>
                                            <input
                                                id={`time-${index}`}
                                                type="number"
                                                inputMode="decimal"
                                                step="0.1"
                                                placeholder="0.0"
                                                value={row.time}
                                                onChange={(e) => handleInputChange(index, 'time', e.target.value)}
                                                onKeyDown={(e) => handleKeyDown(e, index, 'time')}
                                                className="w-full pl-3 pr-10 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all bg-slate-50 focus:bg-white"
                                            />
                                            <div className="absolute right-3 top-3.5 text-slate-400">
                                                <Clock size={16} />
                                            </div>
                                        </div>

                                        <button
                                            onClick={() => removeRow(index)}
                                            className="p-3 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors"
                                            title="Sor törlése"
                                        >
                                            <Trash2 size={18} />
                                        </button>
                                    </div>
                                ))}

                                <div className="pt-4 flex flex-col sm:flex-row gap-3">
                                    <button
                                        onClick={addRow}
                                        className="flex-1 flex items-center justify-center gap-2 py-3 border-2 border-dashed border-slate-300 rounded-lg text-slate-500 hover:border-blue-500 hover:text-blue-500 transition-all font-medium"
                                    >
                                        <Plus size={18} /> Új tálca <span className="hidden sm:inline">(Nyomj P-t)</span>
                                    </button>
                                    
                                    <button
                                        onClick={calculate}
                                        className="flex-1 flex items-center justify-center gap-2 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg shadow-md shadow-blue-200 transition-all font-bold text-lg"
                                    >
                                        <Calculator size={20} /> Számítás
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Results Card */}
                        {results && (
                            <div className="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200 animate-in fade-in zoom-in-95 duration-500 mb-8">
                                <div className="bg-slate-900 text-white px-6 py-4 flex justify-between items-center">
                                    <h2 className="font-bold text-lg flex items-center gap-2">
                                        <DollarSign size={20} className="text-green-400" /> Értékelés
                                    </h2>
                                    <div className="text-sm text-slate-400">
                                        {results.totals.resource}g / {results.totals.time}óra
                                    </div>
                                </div>

                                <div className="p-0">
                                    <table className="w-full text-left">
                                        <tbody>
                                            {/* Base Price */}
                                            <tr className="border-b border-slate-100 bg-slate-50/50">
                                                <td className="p-4 text-slate-500 font-medium w-1/2">
                                                    Gyártási ár <span className="text-xs font-normal block sm:inline">(mindennel együtt)</span>
                                                </td>
                                                <td className="p-4 font-mono text-lg font-semibold text-slate-700 text-right">
                                                    {formatCurrency(results.basePrice)}
                                                </td>
                                            </tr>

                                            {/* Discounted Resell - Highlighted */}
                                            <tr className="bg-blue-50/50 border-b border-blue-100">
                                                <td className="p-4 w-1/2">
                                                    <div className="font-bold text-blue-900">Mennyiségi ár</div>
                                                    <div className="text-xs text-blue-600 font-medium">Gyártási ár x 3 (Kerekítve)</div>
                                                </td>
                                                <td className="p-4 text-right">
                                                    <div className="font-mono text-2xl font-bold text-blue-700">
                                                        {formatCurrency(results.discountedResell)}
                                                    </div>
                                                </td>
                                            </tr>

                                            {/* Ranges */}
                                            {[
                                                { label: 'Kedvezményes sáv 1', multi: '1.2x', val: results.range1 },
                                                { label: 'Kedvezményes sáv 2', multi: '1.4x', val: results.range2 },
                                                { label: 'Kedvezményes sáv 3', multi: '1.6x', val: results.range3 },
                                            ].map((item, i) => (
                                                <tr key={i} className="border-b border-slate-100 hover:bg-slate-50 transition-colors group">
                                                    <td className="p-4 w-1/2">
                                                        <div className="font-medium text-slate-700 group-hover:text-slate-900">{item.label}</div>
                                                        <div className="text-xs text-slate-400">Szorzó 1 x {item.multi}</div>
                                                    </td>
                                                    <td className="p-4 text-right">
                                                        <div className="font-mono text-xl font-semibold text-slate-600 group-hover:text-slate-900">
                                                            {formatCurrency(item.val)}
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                                
                                <div className="bg-slate-50 px-6 py-3 text-xs text-slate-400 text-center border-t border-slate-200">
                                    50 Forintra kerekítve
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PricingCalculator />);
    </script>
</body>
</html>
